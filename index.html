<!DOCTYPE html>
<html lang="en" class="h-full antialiased dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Matrix — Geist</title>
    
    <!-- Vercel Geist Font (Geist Sans & Geist Mono) via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Geist Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                        mono: ['"Geist Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
                    },
                    colors: {
                        geist: {
                            bg: '#000000',
                            foreground: '#ededed',
                            accents1: '#111111',
                            accents2: '#222222',
                            accents3: '#333333',
                            accents4: '#444444',
                            accents5: '#666666',
                            accents6: '#888888',
                            accents7: '#eaeaea',
                            accents8: '#fafafa',
                            success: '#0070f3',
                            cyan: '#50e3c2',
                            highlight: '#ff0080',
                            warning: '#f5a623',
                            error: '#ee0000'
                        }
                    },
                    letterSpacing: {
                        tighter: '-0.04em',
                        tight: '-0.02em',
                    }
                }
            }
        }
    </script>
    <style>
        /* Vercel Geist Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #eaeaea;
            border-radius: 0px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #222222;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #888888;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #333333;
        }

        /* Geist Checkbox */
        .geist-checkbox {
            appearance: none;
            background-color: #ffffff;
            border: 1px solid #d4d4d8;
            border-radius: 3px;
            display: inline-grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .dark .geist-checkbox {
            background-color: #000000;
            border-color: #333333;
        }
        .geist-checkbox:hover {
            border-color: #52525b;
        }
        .dark .geist-checkbox:hover {
            border-color: #666666;
            background-color: #111111;
        }
        .geist-checkbox:focus-visible {
            outline: 2px solid #000000;
            outline-offset: 1px;
        }
        .dark .geist-checkbox:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 1px;
        }
        .task-item.completed .geist-checkbox {
            background-color: #000000;
            border-color: #000000;
        }
        .dark .task-item.completed .geist-checkbox {
            background-color: #ffffff;
            border-color: #ffffff;
        }
        .task-item.completed .task-title {
            text-decoration: line-through;
            color: #71717a;
        }
        .dark .task-item.completed .task-title {
            color: #666666;
        }

        /* Status Styling on Task Rows */
        .task-item.is-overdue {
            border-left: 2px solid #ee0000 !important;
            background-color: rgba(238, 0, 0, 0.04);
        }
        .dark .task-item.is-overdue {
            background-color: rgba(238, 0, 0, 0.05);
        }

        .task-item.is-due-today {
            border-left: 2px solid #f5a623 !important;
            background-color: rgba(245, 166, 35, 0.03);
        }

        /* Subtle Geist Grid Overlay Background */
        .geist-grid-bg {
            background-size: 24px 24px;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.075) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 0, 0, 0.075) 1px, transparent 1px);
        }
        .dark .geist-grid-bg {
            background-image: linear-gradient(to right, rgba(34, 34, 34, 0.5) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(34, 34, 34, 0.5) 1px, transparent 1px);
        }

        /* Assignee Dot Colors */
        .cal-person-dot[data-person="Dad"] { background-color: #0070f3; }
        .cal-person-dot[data-person="Mom"] { background-color: #eb367f; }
    </style>
</head>
<body class="min-h-full bg-white dark:bg-black font-sans text-[#111111] dark:text-[#ededed] selection:bg-[#0070f3] selection:text-white pb-12 transition-colors duration-150 geist-grid-bg">

    <!-- Top Compact Header (Sticky) -->
    <header class="border-b border-[#d4d4d8] dark:border-[#222222] bg-white/90 dark:bg-black/85 backdrop-blur-md sticky top-0 z-40 transition-colors duration-150">
        <div class="max-w-5xl mx-auto px-4 sm:px-5 h-11 flex items-center justify-between">
            <!-- Brand Indicator & Compact Date -->
            <div class="flex items-center gap-2.5">
                <div class="w-5 h-5 flex items-center justify-center text-black dark:text-white">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 76 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M37.5274 0L75.0548 65H0L37.5274 0Z" />
                    </svg>
                </div>
                <div class="h-3.5 w-px bg-[#d4d4d8] dark:bg-[#333333]"></div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold tracking-tight text-[#09090b] dark:text-[#ededed]">Task Matrix</span>
                    <span class="font-mono text-[9px] px-1 py-0.2 rounded border border-[#d4d4d8] dark:border-[#333333] bg-[#f4f4f5] dark:bg-[#111111] text-[#52525b] dark:text-[#888888]">v8.0</span>
                    <span id="header-date-badge" class="font-mono text-[11px] text-[#71717a] dark:text-[#666666] hidden sm:inline ml-1">Today</span>
                </div>
            </div>

            <!-- Top Action Controls -->
            <div class="flex items-center gap-1.5">
                <!-- Theme Mode Toggle Button -->
                <button 
                    id="theme-toggle-btn" 
                    type="button" 
                    class="h-7 px-2 rounded text-xs font-medium border border-[#d4d4d8] dark:border-[#333333] bg-white dark:bg-[#111111] text-[#3f3f46] dark:text-[#888888] hover:text-black dark:hover:text-white hover:border-[#71717a] dark:hover:border-[#666666] hover:bg-[#f4f4f5] transition-all flex items-center gap-1 focus:outline-none"
                    title="Toggle light / dark mode"
                    aria-label="Toggle theme"
                >
                    <span id="theme-btn-icon" class="text-[11px]">🌙</span>
                    <span id="theme-btn-text" class="font-mono text-[10px] hidden sm:inline">Dark</span>
                </button>

                <!-- Notifications Toggle Button -->
                <button 
                    id="enable-notifications-btn" 
                    type="button" 
                    class="h-7 px-2 rounded text-xs font-medium border border-[#d4d4d8] dark:border-[#333333] bg-white dark:bg-[#111111] text-[#3f3f46] dark:text-[#888888] hover:text-black dark:hover:text-white hover:border-[#71717a] dark:hover:border-[#666666] hover:bg-[#f4f4f5] transition-all flex items-center gap-1 focus:outline-none"
                >
                    <span id="notif-btn-icon" class="text-[11px]">🔔</span>
                    <span id="notif-btn-text" class="font-mono text-[10px] hidden sm:inline">Alerts On</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace Content (Dense & Shifted Up) -->
    <main class="max-w-5xl mx-auto px-4 sm:px-5 pt-4">
        <!-- Layout Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
            
            <!-- Left Column: New Task Form & Task List (7 cols) -->
            <div class="lg:col-span-7 space-y-4">
                
                <!-- Dense Vercel Card: Add Task Form -->
                <div class="bg-white dark:bg-[#000000] border border-[#d4d4d8] dark:border-[#222222] rounded-md p-3.5 shadow-sm dark:shadow-[0_0_0_1px_rgba(0,0,0,0.02)] transition-colors duration-150">
                    <form id="task-form" class="space-y-2.5">
                        <div class="flex items-center gap-2">
                            <input 
                                type="text" 
                                id="task-title-input" 
                                class="w-full bg-[#f4f4f5] dark:bg-[#111111] border border-[#d4d4d8] dark:border-[#333333] rounded px-2.5 py-1.5 text-xs text-black dark:text-white placeholder-[#71717a] dark:placeholder-[#666666] focus:outline-none focus:border-black dark:focus:border-white transition font-sans"
                                placeholder="What needs to be scheduled?" 
                                autocomplete="off"
                                required
                            />
                            <button 
                                type="submit" 
                                id="btn-submit-task" 
                                class="h-7 px-3 rounded bg-black dark:bg-white hover:bg-[#27272a] dark:hover:bg-[#eaeaea] text-white dark:text-black text-xs font-medium transition-colors focus:outline-none flex items-center gap-1 whitespace-nowrap shadow-sm"
                            >
                                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                <span>Add</span>
                            </button>
                        </div>

                        <!-- Form Meta Fields Grid (Dense) -->
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-1.5">
                            <div>
                                <label for="task-date-input" class="block font-mono text-[10px] text-[#52525b] dark:text-[#888888] mb-0.5 font-medium">Date</label>
                                <input 
                                    type="date" 
                                    id="task-date-input" 
                                    class="w-full bg-[#f4f4f5] dark:bg-[#111111] border border-[#d4d4d8] dark:border-[#333333] rounded px-1.5 py-1 text-[11px] text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white transition font-mono"
                                    required 
                                />
                            </div>

                            <div>
                                <label for="task-starttime-select" class="block font-mono text-[10px] text-[#52525b] dark:text-[#888888] mb-0.5 font-medium">Time</label>
                                <select 
                                    id="task-starttime-select" 
                                    class="w-full bg-[#f4f4f5] dark:bg-[#111111] border border-[#d4d4d8] dark:border-[#333333] rounded px-1.5 py-1 text-[11px] text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white transition font-mono"
                                >
                                    <!-- Populated dynamically -->
                                </select>
                            </div>

                            <div>
                                <label for="task-duration-select" class="block font-mono text-[10px] text-[#52525b] dark:text-[#888888] mb-0.5 font-medium">Duration</label>
                                <select 
                                    id="task-duration-select" 
                                    class="w-full bg-[#f4f4f5] dark:bg-[#111111] border border-[#d4d4d8] dark:border-[#333333] rounded px-1.5 py-1 text-[11px] text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white transition font-mono"
                                >
                                    <option value="15 min">15m</option>
                                    <option value="30 min" selected>30m</option>
                                    <option value="45 min">45m</option>
                                    <option value="1 hr">1h</option>
                                    <option value="2 hrs">2h</option>
                                    <option value="4 hrs">4h</option>
                                    <option value="Full day">Day</option>
                                </select>
                            </div>

                            <div>
                                <label for="task-reminder-input" class="block font-mono text-[10px] text-[#52525b] dark:text-[#888888] mb-0.5 font-medium">Reminder</label>
                                <input 
                                    type="time" 
                                    id="task-reminder-input" 
                                    class="w-full bg-[#f4f4f5] dark:bg-[#111111] border border-[#d4d4d8] dark:border-[#333333] rounded px-1.5 py-1 text-[11px] text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white transition font-mono"
                                />
                            </div>

                            <div>
                                <label for="task-person-select" class="block font-mono text-[10px] text-[#52525b] dark:text-[#888888] mb-0.5 font-medium">Assignee</label>
                                <select 
                                    id="task-person-select" 
                                    class="w-full bg-[#f4f4f5] dark:bg-[#111111] border border-[#d4d4d8] dark:border-[#333333] rounded px-1.5 py-1 text-[11px] text-black dark:text-white focus:outline-none focus:border-black dark:focus:border-white transition font-mono"
                                >
                                    <option value="Dad">Dad</option>
                                    <option value="Mom">Mom</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Tasks Listing Card (Dense) -->
                <div class="bg-white dark:bg-[#000000] border border-[#d4d4d8] dark:border-[#222222] rounded-md overflow-hidden transition-colors duration-150 shadow-sm dark:shadow-none">
                    
                    <!-- Segmented Filters & Active Scope -->
                    <div class="px-3 py-2 border-b border-[#d4d4d8] dark:border-[#222222] flex flex-wrap items-center justify-between gap-2 bg-[#f4f4f5] dark:bg-[#0a0a0a]">
                        <!-- Vercel-style Tab Pills -->
                        <div class="inline-flex rounded bg-[#e4e4e7] dark:bg-[#111111] p-0.5 border border-[#d4d4d8] dark:border-[#222222] text-xs font-mono">
                            <button class="filter-pill-btn px-2 py-0.5 rounded text-[11px] font-semibold text-black dark:text-white bg-white dark:bg-[#222222] shadow-sm transition" data-filter="all">all</button>
                            <button class="filter-pill-btn px-2 py-0.5 rounded text-[11px] font-medium text-[#52525b] dark:text-[#888888] hover:text-black dark:hover:text-white transition" data-filter="active">active</button>
                            <button class="filter-pill-btn px-2 py-0.5 rounded text-[11px] font-medium text-[#52525b] dark:text-[#888888] hover:text-black dark:hover:text-white transition" data-filter="completed">completed</button>
                        </div>

                        <!-- Active Date Filter Indicator Tag -->
                        <div id="active-date-container" class="items-center gap-1 px-1.5 py-0.2 rounded border border-[#d4d4d8] dark:border-[#333333] bg-white dark:bg-[#111111] font-mono text-[10px] text-[#111111] dark:text-[#ededed]" style="display: none;">
                            <span class="text-[#71717a]">date:</span>
                            <span><strong id="active-date-label">Today</strong></span>
                            <button id="btn-clear-date-filter" class="ml-0.5 text-[#71717a] hover:text-black dark:hover:text-white transition" title="Show all dates">
                                ✕
                            </button>
                        </div>

                        <div id="task-count-text" class="font-mono text-[10px] text-[#52525b] dark:text-[#666666] ml-auto">
                            0 items
                        </div>
                    </div>

                    <!-- Dynamic Task List -->
                    <ul id="task-list" class="divide-y divide-[#d4d4d8] dark:divide-[#222222]">
                        <!-- Rendered dynamically -->
                    </ul>

                    <!-- Empty State -->
                    <div id="tasks-empty-state" class="py-8 px-4 text-center hidden">
                        <div class="w-6 h-6 mx-auto mb-1.5 rounded border border-[#d4d4d8] dark:border-[#333333] bg-[#f4f4f5] dark:bg-[#111111] flex items-center justify-center text-[#71717a]">
                            <span class="font-mono text-[10px]">0</span>
                        </div>
                        <p class="text-xs text-[#71717a] dark:text-[#666666]">No records found for current filters.</p>
                    </div>

                    <!-- Card Bottom Footer -->
                    <div class="px-3 py-1.5 bg-[#f4f4f5] dark:bg-[#0a0a0a] border-t border-[#d4d4d8] dark:border-[#222222] flex items-center justify-between text-[11px] text-[#52525b] dark:text-[#666666] font-mono">
                        <button id="btn-clear-completed" class="hover:text-red-600 transition-colors focus:outline-none">Clear completed</button>
                        <span class="flex items-center gap-1.5 text-[10px]">
                            <span class="w-1.5 h-1.5 rounded-full bg-[#0070f3]"></span>
                            <span>synced local</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Right Column: Interactive Calendar & Analytics (5 cols) -->
            <div class="lg:col-span-5 space-y-4">
                
                <!-- Dense Geist Calendar Card -->
                <div class="bg-white dark:bg-[#000000] border border-[#d4d4d8] dark:border-[#222222] rounded-md p-3.5 shadow-sm dark:shadow-[0_0_0_1px_rgba(0,0,0,0.02)] transition-colors duration-150">
                    <!-- Calendar Header -->
                    <div class="flex items-center justify-between mb-2.5">
                        <h2 id="cal-month-year" class="text-xs font-semibold uppercase tracking-wider text-black dark:text-white font-mono">August 2026</h2>
                        <div class="flex items-center gap-1 font-mono text-xs">
                            <button id="cal-prev-btn" class="h-6 w-6 rounded border border-[#d4d4d8] dark:border-[#333333] text-[#3f3f46] dark:text-[#888888] hover:text-black dark:hover:text-white hover:border-[#71717a] dark:hover:border-[#666666] hover:bg-[#f4f4f5] flex items-center justify-center transition" title="Previous Month">
                                ‹
                            </button>
                            <button id="cal-today-btn" class="h-6 px-1.5 rounded border border-[#d4d4d8] dark:border-[#333333] text-[#3f3f46] dark:text-[#888888] hover:text-black dark:hover:text-white hover:bg-[#f4f4f5] text-[10px] transition">today</button>
                            <button id="cal-next-btn" class="h-6 w-6 rounded border border-[#d4d4d8] dark:border-[#333333] text-[#3f3f46] dark:text-[#888888] hover:text-black dark:hover:text-white hover:border-[#71717a] dark:hover:border-[#666666] hover:bg-[#f4f4f5] flex items-center justify-center transition" title="Next Month">
                                ›
                            </button>
                        </div>
                    </div>

                    <!-- Weekday Headers -->
                    <div class="grid grid-cols-7 gap-1 text-center mb-1 font-mono text-[9px] text-[#71717a] dark:text-[#666666] uppercase font-medium">
                        <span class="py-0.5">Su</span>
                        <span class="py-0.5">Mo</span>
                        <span class="py-0.5">Tu</span>
                        <span class="py-0.5">We</span>
                        <span class="py-0.5">Th</span>
                        <span class="py-0.5">Fr</span>
                        <span class="py-0.5">Sa</span>
                    </div>

                    <!-- Days Grid -->
                    <div id="calendar-days-grid" class="grid grid-cols-7 gap-1 text-center font-mono">
                        <!-- Generated dynamically -->
                    </div>

                    <!-- Assignee Legend -->
                    <div class="mt-3 pt-2.5 border-t border-[#d4d4d8] dark:border-[#222222] flex items-center justify-between text-[#52525b] dark:text-[#666666] font-mono text-[10px]">
                        <span>tags:</span>
                        <div class="flex items-center gap-2.5">
                            <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#0070f3]"></span> Dad</span>
                            <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#eb367f]"></span> Mom</span>
                        </div>
                    </div>
                </div>

                <!-- Summary Overview Metric Card (4-grid with Overdue) -->
                <div class="bg-white dark:bg-[#000000] border border-[#d4d4d8] dark:border-[#222222] rounded-md p-3.5 shadow-sm dark:shadow-[0_0_0_1px_rgba(0,0,0,0.02)] space-y-2.5 transition-colors duration-150">
                    <div class="flex items-center justify-between">
                        <span id="summary-date-heading" class="text-xs font-semibold uppercase tracking-wider text-black dark:text-white font-mono">Scope Summary</span>
                        <span class="font-mono text-[9px] px-1 py-0.2 rounded border border-[#d4d4d8] dark:border-[#333333] text-[#52525b] bg-[#f4f4f5] dark:bg-transparent">metrics</span>
                    </div>

                    <div class="grid grid-cols-4 gap-1.5">
                        <div class="bg-[#f4f4f5] dark:bg-[#111111] border border-[#d4d4d8] dark:border-[#222222] rounded p-1.5 text-center">
                            <div id="stat-total-tasks" class="font-mono text-sm font-semibold text-black dark:text-white">0</div>
                            <div class="font-mono text-[9px] uppercase text-[#52525b] dark:text-[#666666]">Total</div>
                        </div>
                        <div class="bg-[#f4f4f5] dark:bg-[#111111] border border-[#0070f3]/25 dark:border-[#222222] rounded p-1.5 text-center">
                            <div id="stat-pending-tasks" class="font-mono text-sm font-semibold text-[#0070f3]">0</div>
                            <div class="font-mono text-[9px] uppercase text-[#0070f3]/90 dark:text-[#666666]">Active</div>
                        </div>
                        <div class="bg-[#f4f4f5] dark:bg-[#111111] border border-[#ee0000]/25 dark:border-[#222222] rounded p-1.5 text-center">
                            <div id="stat-overdue-tasks" class="font-mono text-sm font-semibold text-[#ee0000]">0</div>
                            <div class="font-mono text-[9px] uppercase text-[#ee0000]">Overdue</div>
                        </div>
                        <div class="bg-[#f4f4f5] dark:bg-[#111111] border border-[#50e3c2]/40 dark:border-[#222222] rounded p-1.5 text-center">
                            <div id="stat-done-tasks" class="font-mono text-sm font-semibold text-[#047857] dark:text-[#50e3c2]">0</div>
                            <div class="font-mono text-[9px] uppercase text-[#047857] dark:text-[#666666]">Done</div>
                        </div>
                    </div>

                    <button 
                        id="btn-show-all-dates" 
                        class="w-full py-1.5 px-2 bg-[#f4f4f5] dark:bg-[#111111] hover:bg-[#e4e4e7] dark:hover:bg-[#222222] text-black dark:text-white border border-[#d4d4d8] dark:border-[#333333] rounded font-mono text-[11px] transition focus:outline-none"
                    >
                        View all scheduled records
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Geist Minimalist Reminder Modal -->
    <div id="reminder-modal-overlay" class="fixed inset-0 bg-black/60 dark:bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-150">
        <div class="bg-white dark:bg-[#000000] border border-[#d4d4d8] dark:border-[#333333] rounded-md p-5 max-w-sm w-full shadow-2xl space-y-3">
            <div class="flex items-center justify-between border-b border-[#d4d4d8] dark:border-[#222222] pb-2">
                <div class="flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#f5a623] animate-pulse"></span>
                    <h3 class="font-mono text-[11px] uppercase tracking-wider text-black dark:text-white font-semibold">Reminder Alert</h3>
                </div>
                <span class="font-mono text-[10px] text-[#71717a]">due now</span>
            </div>
            
            <div class="bg-[#f4f4f5] dark:bg-[#111111] border border-[#d4d4d8] dark:border-[#222222] rounded p-3 space-y-1">
                <div id="modal-task-title" class="text-xs font-semibold text-black dark:text-white">Sample Task Title</div>
                <div id="modal-task-meta" class="font-mono text-[11px] text-[#52525b] dark:text-[#888888]">Scheduled for today</div>
            </div>

            <div class="flex justify-end pt-1">
                <button 
                    id="btn-modal-dismiss" 
                    type="button" 
                    class="h-7 px-3 bg-black dark:bg-white hover:bg-[#27272a] dark:hover:bg-[#eaeaea] text-white dark:text-black rounded font-mono text-xs transition focus:outline-none"
                >
                    Dismiss
                </button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Storage keys
        const STORAGE_KEY = 'vibe_tasks_matrix_v2';
        const THEME_STORAGE_KEY = 'geist_theme_mode';
        const NOTIF_TOGGLE_KEY = 'vibe_tasks_matrix_notifications_enabled';

        let tasks = [];
        let currentFilter = 'all'; // 'all' | 'active' | 'completed'
        let selectedCalendarDate = null; // 'YYYY-MM-DD' or null for all
        let currentCalendarDate = new Date();
        let notificationsEnabled = true;
        let isDarkMode = true;

        const PERSON_COLORS = {
            Dad: '#0070f3',
            Mom: '#eb367f'
        };
        const PEOPLE = Object.keys(PERSON_COLORS);

        // DOM Elements
        const taskForm = document.getElementById('task-form');
        const taskTitleInput = document.getElementById('task-title-input');
        const taskDateInput = document.getElementById('task-date-input');
        const taskStartTimeSelect = document.getElementById('task-starttime-select');
        const taskDurationSelect = document.getElementById('task-duration-select');
        const taskReminderInput = document.getElementById('task-reminder-input');
        const taskPersonSelect = document.getElementById('task-person-select');
        const taskList = document.getElementById('task-list');
        const tasksEmptyState = document.getElementById('tasks-empty-state');
        const taskCountText = document.getElementById('task-count-text');
        const filterPillBtns = document.querySelectorAll('.filter-pill-btn');
        const activeDateContainer = document.getElementById('active-date-container');
        const activeDateLabel = document.getElementById('active-date-label');
        const btnClearDateFilter = document.getElementById('btn-clear-date-filter');
        const btnClearCompleted = document.getElementById('btn-clear-completed');

        // Calendar Elements
        const calMonthYear = document.getElementById('cal-month-year');
        const calendarDaysGrid = document.getElementById('calendar-days-grid');
        const calPrevBtn = document.getElementById('cal-prev-btn');
        const calNextBtn = document.getElementById('cal-next-btn');
        const calTodayBtn = document.getElementById('cal-today-btn');
        const summaryDateHeading = document.getElementById('summary-date-heading');
        const statTotalTasks = document.getElementById('stat-total-tasks');
        const statPendingTasks = document.getElementById('stat-pending-tasks');
        const statOverdueTasks = document.getElementById('stat-overdue-tasks');
        const statDoneTasks = document.getElementById('stat-done-tasks');
        const btnShowAllDates = document.getElementById('btn-show-all-dates');
        const headerDateBadge = document.getElementById('header-date-badge');

        // Header Action Elements
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeBtnIcon = document.getElementById('theme-btn-icon');
        const themeBtnText = document.getElementById('theme-btn-text');
        const enableNotifBtn = document.getElementById('enable-notifications-btn');
        const notifBtnIcon = document.getElementById('notif-btn-icon');
        const notifBtnText = document.getElementById('notif-btn-text');
        const reminderModalOverlay = document.getElementById('reminder-modal-overlay');
        const modalTaskTitle = document.getElementById('modal-task-title');
        const modalTaskMeta = document.getElementById('modal-task-meta');
        const btnModalDismiss = document.getElementById('btn-modal-dismiss');

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();

            const todayStr = getLocalDateString(new Date());
            taskDateInput.value = todayStr;
            taskDateInput.min = todayStr;

            if (headerDateBadge) {
                const now = new Date();
                headerDateBadge.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            }

            taskStartTimeSelect.innerHTML = buildTimeOptionsHTML('');

            loadTasks();
            setupEventListeners();
            loadNotificationToggleState();
            checkNotificationPermissionStatus();
            
            selectedCalendarDate = todayStr;
            renderCalendar();
            renderTasks();

            setInterval(checkReminders, 5000);
        });

        /**
         * Theme Handling (Light / Dark)
         */
        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
            if (savedTheme) {
                isDarkMode = savedTheme === 'dark';
            } else {
                isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            applyTheme();
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem(THEME_STORAGE_KEY, isDarkMode ? 'dark' : 'light');
            applyTheme();
            renderCalendar();
            renderTasks();
        }

        function applyTheme() {
            const htmlEl = document.documentElement;
            if (isDarkMode) {
                htmlEl.classList.add('dark');
                themeBtnIcon.textContent = '🌙';
                if (themeBtnText) themeBtnText.textContent = 'Dark';
            } else {
                htmlEl.classList.remove('dark');
                themeBtnIcon.textContent = '☀️';
                if (themeBtnText) themeBtnText.textContent = 'Light';
            }
        }

        /**
         * Converts Date object to local YYYY-MM-DD string
         */
        function getLocalDateString(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        /**
         * Builds <option> HTML for 24-hour dropdown (00:00 to 23:30)
         */
        function buildTimeOptionsHTML(selectedValue) {
            let html = `<option value="" ${!selectedValue ? 'selected' : ''}>-- none --</option>`;
            for (let h = 0; h < 24; h++) {
                for (const m of [0, 30]) {
                    const hh = String(h).padStart(2, '0');
                    const mm = String(m).padStart(2, '0');
                    const val = `${hh}:${mm}`;
                    html += `<option value="${val}" ${val === selectedValue ? 'selected' : ''}>${val}</option>`;
                }
            }
            return html;
        }

        /**
         * Load tasks from localStorage safely
         */
        function loadTasks() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    tasks = JSON.parse(saved) || [];
                    tasks = tasks.map(t => PEOPLE.includes(t.person) ? t : { ...t, person: 'Dad' });
                }
            } catch (err) {
                console.error('Error loading tasks:', err);
                tasks = [];
            }
        }

        /**
         * Save tasks to localStorage
         */
        function saveTasks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch (err) {
                console.error('Error saving tasks:', err);
            }
        }

        /**
         * Setup Event Listeners
         */
        function setupEventListeners() {
            themeToggleBtn.addEventListener('click', toggleTheme);

            taskForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const title = taskTitleInput.value.trim();
                const date = taskDateInput.value;
                const startTime = taskStartTimeSelect.value;
                const duration = taskDurationSelect.value;
                const reminder = taskReminderInput.value;
                const person = taskPersonSelect.value;

                if (!title || !date) return;

                const newTask = {
                    id: 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    title: title,
                    date: date,
                    startTime: startTime || null,
                    duration: duration,
                    reminder: reminder || null,
                    person: person,
                    completed: false,
                    notified: false,
                    createdAt: Date.now()
                };

                tasks.unshift(newTask);
                saveTasks();

                taskTitleInput.value = '';
                taskStartTimeSelect.value = '';
                taskReminderInput.value = '';
                taskTitleInput.focus();

                selectedCalendarDate = date;
                currentCalendarDate = new Date(date + 'T00:00:00');

                renderCalendar();
                renderTasks();
            });

            // List item clicks
            taskList.addEventListener('click', (e) => {
                const target = e.target;
                const itemEl = target.closest('.task-item');
                if (!itemEl) return;

                const id = itemEl.dataset.id;

                if (target.closest('.btn-delete-task')) {
                    tasks = tasks.filter(t => t.id !== id);
                    saveTasks();
                    renderCalendar();
                    renderTasks();
                    return;
                }

                if (target.closest('.btn-edit-task')) {
                    activateInlineEdit(itemEl, id);
                    return;
                }

                if (target.closest('.task-toggle-area')) {
                    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
                    saveTasks();
                    renderCalendar();
                    renderTasks();
                }
            });

            // Filter Tabs
            filterPillBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterPillBtns.forEach(b => {
                        b.classList.remove('bg-white', 'dark:bg-[#222222]', 'text-black', 'dark:text-white', 'shadow-sm');
                        b.classList.add('text-[#666666]', 'dark:text-[#888888]');
                    });
                    btn.classList.add('bg-white', 'dark:bg-[#222222]', 'text-black', 'dark:text-white', 'shadow-sm');
                    btn.classList.remove('text-[#666666]', 'dark:text-[#888888]');
                    currentFilter = btn.dataset.filter;
                    renderTasks();
                });
            });

            // Clear Completed
            btnClearCompleted.addEventListener('click', () => {
                tasks = tasks.filter(t => !t.completed);
                saveTasks();
                renderCalendar();
                renderTasks();
            });

            // Clear Date filter button
            btnClearDateFilter.addEventListener('click', () => {
                selectedCalendarDate = null;
                renderCalendar();
                renderTasks();
            });

            btnShowAllDates.addEventListener('click', () => {
                selectedCalendarDate = null;
                renderCalendar();
                renderTasks();
            });

            // Calendar Navigation
            calPrevBtn.addEventListener('click', () => {
                currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
                renderCalendar();
            });

            calNextBtn.addEventListener('click', () => {
                currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
                renderCalendar();
            });

            calTodayBtn.addEventListener('click', () => {
                currentCalendarDate = new Date();
                selectedCalendarDate = getLocalDateString(new Date());
                renderCalendar();
                renderTasks();
            });

            // Notification on/off toggle button
            enableNotifBtn.addEventListener('click', () => {
                notificationsEnabled = !notificationsEnabled;
                saveNotificationToggleState();
                updateNotificationButtonUI();

                if (notificationsEnabled && "Notification" in window && Notification.permission !== "granted") {
                    requestNotificationPermission();
                }
            });

            // Dismiss Reminder Modal
            btnModalDismiss.addEventListener('click', () => {
                reminderModalOverlay.classList.add('opacity-0', 'pointer-events-none');
                reminderModalOverlay.classList.remove('opacity-100', 'pointer-events-auto');
            });
        }

        /**
         * Render Task List with Geist styling & Overdue Differentiation
         */
        function renderTasks() {
            const todayStr = getLocalDateString(new Date());

            let filtered = tasks;
            if (selectedCalendarDate) {
                filtered = filtered.filter(t => t.date === selectedCalendarDate);
                activeDateContainer.style.display = 'inline-flex';
                
                const dateParts = selectedCalendarDate.split('-');
                const dObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                activeDateLabel.textContent = dObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            } else {
                activeDateContainer.style.display = 'none';
            }

            if (currentFilter === 'active') {
                filtered = filtered.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filtered = filtered.filter(t => t.completed);
            }

            taskList.innerHTML = '';

            filtered.forEach(task => {
                const li = document.createElement('li');
                
                // Status Calculation
                const isOverdue = !task.completed && task.date < todayStr;
                const isDueToday = !task.completed && task.date === todayStr;

                let statusClass = '';
                if (task.completed) {
                    statusClass = 'completed bg-[#fafafa]/50 dark:bg-[#0a0a0a]';
                } else if (isOverdue) {
                    statusClass = 'is-overdue';
                } else if (isDueToday) {
                    statusClass = 'is-due-today';
                }

                li.className = `task-item group flex items-start justify-between gap-2.5 p-2.5 hover:bg-[#fafafa] dark:hover:bg-[#111111] transition-colors ${statusClass}`;
                li.dataset.id = task.id;

                const dateParts = task.date.split('-');
                const dateObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

                const personName = task.person || 'Dad';
                const personBadgeStyles = personName === 'Mom' 
                    ? 'border-[#eb367f]/30 text-[#eb367f] bg-[#eb367f]/5' 
                    : 'border-[#0070f3]/30 text-[#0070f3] bg-[#0070f3]/5';

                // Status Badge
                let statusBadgeHTML = '';
                if (isOverdue) {
                    statusBadgeHTML = `<span class="inline-flex items-center px-1 py-0.1 rounded border border-[#ee0000]/40 text-[#ee0000] bg-[#ee0000]/10 font-mono font-semibold text-[9px] uppercase tracking-wider">overdue</span>`;
                } else if (isDueToday) {
                    statusBadgeHTML = `<span class="inline-flex items-center px-1 py-0.1 rounded border border-[#f5a623]/40 text-[#f5a623] bg-[#f5a623]/10 font-mono font-medium text-[9px] uppercase tracking-wider">today</span>`;
                }

                li.innerHTML = `
                    <div class="flex items-start gap-2.5 min-w-0 flex-1">
                        <div class="task-toggle-area pt-0.5 cursor-pointer">
                            <div class="geist-checkbox w-3.5 h-3.5 rounded text-black dark:text-white flex items-center justify-center ${isOverdue ? 'border-[#ee0000]/60' : ''}">
                                <svg class="w-2 h-2 ${task.completed ? 'opacity-100' : 'opacity-0'} transition-opacity stroke-white dark:stroke-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="space-y-0.5 min-w-0 flex-1">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <p class="task-title text-xs font-medium text-black dark:text-[#ededed] leading-snug break-words"></p>
                                ${statusBadgeHTML}
                            </div>
                            <div class="flex flex-wrap items-center gap-1 font-mono text-[10px] text-[#52525b] dark:text-[#666666]">
                                <span class="inline-flex items-center px-1 py-0.1 rounded border ${personBadgeStyles}">
                                    ${personName}
                                </span>
                                <span class="inline-flex items-center px-1 py-0.1 rounded border ${isOverdue ? 'border-[#ee0000]/40 text-[#ee0000]' : 'border-[#d4d4d8] dark:border-[#222222]'} bg-[#f4f4f5] dark:bg-[#111111]">
                                    ${formattedDate}
                                </span>
                                ${task.startTime ? `<span class="inline-flex items-center px-1 py-0.1 rounded border border-[#d4d4d8] dark:border-[#222222] bg-[#f4f4f5] dark:bg-[#111111]">${task.startTime}</span>` : ''}
                                <span class="inline-flex items-center px-1 py-0.1 rounded border border-[#d4d4d8] dark:border-[#222222] bg-[#f4f4f5] dark:bg-[#111111]">${task.duration}</span>
                                ${task.reminder ? `<span class="inline-flex items-center px-1 py-0.1 rounded border border-[#f5a623]/40 text-[#b45309] dark:text-[#f5a623] bg-[#f5a623]/10">🔔 ${task.reminder}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity font-mono text-xs">
                        <button class="btn-edit-task p-1 rounded text-[#71717a] hover:text-black dark:hover:text-white transition" title="Edit task">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                        <button class="btn-delete-task p-1 rounded text-[#71717a] hover:text-red-600 transition" title="Delete task">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                `;

                li.querySelector('.task-title').textContent = task.title;
                taskList.appendChild(li);
            });

            if (filtered.length === 0) {
                tasksEmptyState.classList.remove('hidden');
            } else {
                tasksEmptyState.classList.add('hidden');
            }

            const activeCount = tasks.filter(t => !t.completed).length;
            taskCountText.textContent = `${activeCount} ${activeCount === 1 ? 'item' : 'items'}`;

            updateCalendarSummary();
        }

        /**
         * Inline Edit Mode with dense Geist form styling
         */
        function activateInlineEdit(itemEl, id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            const currentPerson = task.person || 'Dad';

            itemEl.innerHTML = `
                <form class="task-edit-form w-full p-2 space-y-2 bg-[#f4f4f5] dark:bg-[#111111] rounded border border-[#d4d4d8] dark:border-[#333333]" id="edit-form-${id}">
                    <input
                        type="text"
                        class="w-full bg-white dark:bg-black border border-[#d4d4d8] dark:border-[#333333] rounded px-2 py-1 text-xs text-black dark:text-white placeholder-[#71717a] focus:outline-none focus:border-black dark:focus:border-white font-sans"
                        id="edit-title-${id}"
                        value=""
                        placeholder="Task title"
                        required
                        autocomplete="off"
                    />
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-1.5 font-mono">
                        <input type="date" class="bg-white dark:bg-black border border-[#d4d4d8] dark:border-[#333333] rounded px-1.5 py-0.5 text-[11px] text-black dark:text-white" id="edit-date-${id}" value="${task.date}" required />
                        <select class="bg-white dark:bg-black border border-[#d4d4d8] dark:border-[#333333] rounded px-1.5 py-0.5 text-[11px] text-black dark:text-white" id="edit-starttime-${id}">
                            ${buildTimeOptionsHTML(task.startTime || '')}
                        </select>
                        <select class="bg-white dark:bg-black border border-[#d4d4d8] dark:border-[#333333] rounded px-1.5 py-0.5 text-[11px] text-black dark:text-white" id="edit-duration-${id}">
                            <option value="15 min" ${task.duration === '15 min' ? 'selected' : ''}>15m</option>
                            <option value="30 min" ${task.duration === '30 min' ? 'selected' : ''}>30m</option>
                            <option value="45 min" ${task.duration === '45 min' ? 'selected' : ''}>45m</option>
                            <option value="1 hr" ${task.duration === '1 hr' ? 'selected' : ''}>1h</option>
                            <option value="2 hrs" ${task.duration === '2 hrs' ? 'selected' : ''}>2h</option>
                            <option value="4 hrs" ${task.duration === '4 hrs' ? 'selected' : ''}>4h</option>
                            <option value="Full day" ${task.duration === 'Full day' ? 'selected' : ''}>Day</option>
                        </select>
                        <input type="time" class="bg-white dark:bg-black border border-[#d4d4d8] dark:border-[#333333] rounded px-1.5 py-0.5 text-[11px] text-black dark:text-white" id="edit-reminder-${id}" value="${task.reminder || ''}" />
                        <select class="bg-white dark:bg-black border border-[#d4d4d8] dark:border-[#333333] rounded px-1.5 py-0.5 text-[11px] text-black dark:text-white" id="edit-person-${id}">
                            <option value="Dad" ${currentPerson === 'Dad' ? 'selected' : ''}>Dad</option>
                            <option value="Mom" ${currentPerson === 'Mom' ? 'selected' : ''}>Mom</option>
                        </select>
                    </div>
                    <div class="flex justify-end gap-1.5 font-mono text-xs">
                        <button type="button" class="px-2 py-0.5 rounded bg-[#e4e4e7] dark:bg-[#222222] text-[#52525b] dark:text-[#888888] hover:text-black dark:hover:text-white text-[11px] transition" data-cancel-id="${id}">cancel</button>
                        <button type="submit" class="px-2.5 py-0.5 rounded bg-black dark:bg-white text-white dark:text-black text-[11px] transition">save</button>
                    </div>
                </form>
            `;

            document.getElementById(`edit-title-${id}`).value = task.title;
            document.getElementById(`edit-title-${id}`).focus();

            document.getElementById(`edit-form-${id}`).addEventListener('submit', (e) => {
                e.preventDefault();
                const newTitle = document.getElementById(`edit-title-${id}`).value.trim();
                const newDate  = document.getElementById(`edit-date-${id}`).value;
                const newStartTime = document.getElementById(`edit-starttime-${id}`).value || null;
                const newDuration = document.getElementById(`edit-duration-${id}`).value;
                const newReminder = document.getElementById(`edit-reminder-${id}`).value || null;
                const newPerson   = document.getElementById(`edit-person-${id}`).value;

                if (!newTitle || !newDate) return;

                tasks = tasks.map(t => t.id === id
                    ? { ...t, title: newTitle, date: newDate, startTime: newStartTime, duration: newDuration, reminder: newReminder, person: newPerson, notified: false }
                    : t
                );
                saveTasks();

                currentCalendarDate = new Date(newDate + 'T00:00:00');
                selectedCalendarDate = newDate;

                renderCalendar();
                renderTasks();
            });

            document.querySelector(`[data-cancel-id="${id}"]`).addEventListener('click', () => {
                renderTasks();
            });
        }

        /**
         * Render Geist Monthly Calendar (Dense with Overdue indicators)
         */
        function renderCalendar() {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];
            calMonthYear.textContent = `${monthNames[month]} ${year}`;

            calendarDaysGrid.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const todayFormatted = getLocalDateString(new Date());

            // Empty prefix cells
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'aspect-square rounded border border-transparent';
                calendarDaysGrid.appendChild(emptyCell);
            }

            // Month days
            for (let day = 1; day <= lastDate; day++) {
                const dayCell = document.createElement('button');
                dayCell.type = 'button';
                
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const cellDateStr = `${year}-${monthStr}-${dayStr}`;
                dayCell.dataset.date = cellDateStr;

                const isToday = (cellDateStr === todayFormatted);
                const isSelected = (cellDateStr === selectedCalendarDate);

                let baseClasses = "aspect-square rounded flex flex-col items-center justify-center relative text-[11px] font-mono transition focus:outline-none ";
                if (isSelected) {
                    baseClasses += "bg-black dark:bg-white text-white dark:text-black font-semibold shadow-sm ";
                } else if (isToday) {
                    baseClasses += "border border-black dark:border-white text-black dark:text-white font-semibold ";
                } else {
                    baseClasses += "text-[#3f3f46] dark:text-[#888888] hover:bg-[#f4f4f5] dark:hover:bg-[#111111] hover:text-black dark:hover:text-white border border-transparent ";
                }
                dayCell.className = baseClasses;

                dayCell.innerHTML = `<span>${day}</span>`;

                // Multi-person dot indicators & Overdue marker
                const tasksOnThisDate = tasks.filter(t => t.date === cellDateStr);
                if (tasksOnThisDate.length > 0) {
                    const hasOverdue = tasksOnThisDate.some(t => !t.completed && t.date < todayFormatted);
                    const peopleOnDay = [...new Set(tasksOnThisDate.map(t => t.person || 'Dad'))];
                    const dotsRow = document.createElement('div');
                    dotsRow.className = 'flex items-center justify-center gap-0.5 mt-0.5';

                    if (hasOverdue && !isSelected) {
                        const ovdDot = document.createElement('span');
                        ovdDot.className = 'w-1 h-1 rounded-full bg-[#ee0000]';
                        ovdDot.title = 'Has overdue tasks';
                        dotsRow.appendChild(ovdDot);
                    }

                    peopleOnDay.forEach(p => {
                        const d = document.createElement('span');
                        d.className = `cal-person-dot w-1 h-1 rounded-full ${isSelected ? 'bg-white dark:bg-black' : ''}`;
                        d.dataset.person = p;
                        dotsRow.appendChild(d);
                    });
                    dayCell.appendChild(dotsRow);
                }

                dayCell.addEventListener('click', () => {
                    if (selectedCalendarDate === cellDateStr) {
                        selectedCalendarDate = null;
                    } else {
                        selectedCalendarDate = cellDateStr;
                    }
                    renderCalendar();
                    renderTasks();
                });

                calendarDaysGrid.appendChild(dayCell);
            }
        }

        /**
         * Update Calendar Summary Card (Includes Overdue count)
         */
        function updateCalendarSummary() {
            const todayStr = getLocalDateString(new Date());

            let relevantTasks = tasks;
            if (selectedCalendarDate) {
                relevantTasks = tasks.filter(t => t.date === selectedCalendarDate);
                const dateParts = selectedCalendarDate.split('-');
                const dObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                summaryDateHeading.textContent = dObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } else {
                summaryDateHeading.textContent = 'All Dates';
            }

            const total = relevantTasks.length;
            const done = relevantTasks.filter(t => t.completed).length;
            const overdue = relevantTasks.filter(t => !t.completed && t.date < todayStr).length;
            const pending = total - done;

            statTotalTasks.textContent = total;
            statPendingTasks.textContent = pending;
            if (statOverdueTasks) statOverdueTasks.textContent = overdue;
            statDoneTasks.textContent = done;
        }

        /**
         * Check and trigger reminders for tasks
         */
        function checkReminders() {
            if (!notificationsEnabled) return;

            const now = new Date();
            const todayStr = getLocalDateString(now);
            const currentHours = String(now.getHours()).padStart(2, '0');
            const currentMinutes = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${currentHours}:${currentMinutes}`;

            tasks.forEach(task => {
                if (!task.completed && !task.notified && task.reminder) {
                    if (task.date === todayStr && task.reminder <= currentTimeStr) {
                        task.notified = true;
                        saveTasks();

                        triggerReminderModal(task);
                        playChimeSound();

                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification(`Task Reminder: ${task.title}`, {
                                body: `Scheduled for ${task.date} • Duration: ${task.duration}`,
                                icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%230070f3"><circle cx="12" cy="12" r="10"/></svg>'
                            });
                        }
                    }
                }
            });
        }

        /**
         * Shows floating modal
         */
        function triggerReminderModal(task) {
            modalTaskTitle.textContent = task.title;
            modalTaskMeta.textContent = `Scheduled: ${task.date} at ${task.reminder} • Duration: ${task.duration}`;
            reminderModalOverlay.classList.remove('opacity-0', 'pointer-events-none');
            reminderModalOverlay.classList.add('opacity-100', 'pointer-events-auto');
        }

        /**
         * Audio Synthesizer Chime
         */
        function playChimeSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.8);
            } catch (e) {
                console.log('Audio playback prevented by browser policy');
            }
        }

        function loadNotificationToggleState() {
            try {
                const saved = localStorage.getItem(NOTIF_TOGGLE_KEY);
                notificationsEnabled = saved === null ? true : saved === 'true';
            } catch (err) {
                notificationsEnabled = true;
            }
            updateNotificationButtonUI();
        }

        function saveNotificationToggleState() {
            try {
                localStorage.setItem(NOTIF_TOGGLE_KEY, String(notificationsEnabled));
            } catch (err) {
                console.error('Error saving notification toggle state:', err);
            }
        }

        function updateNotificationButtonUI() {
            if (notificationsEnabled) {
                enableNotifBtn.classList.remove('opacity-60');
                notifBtnIcon.textContent = '🔔';
                if (notifBtnText) notifBtnText.textContent = 'Alerts On';
            } else {
                enableNotifBtn.classList.add('opacity-60');
                notifBtnIcon.textContent = '🔕';
                if (notifBtnText) notifBtnText.textContent = 'Alerts Off';
            }
        }

        function checkNotificationPermissionStatus() {
            if (!("Notification" in window)) return;
        }

        function requestNotificationPermission() {
            if (!("Notification" in window)) return;
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("Notifications Enabled", {
                        body: "You will receive timely reminders for your scheduled tasks."
                    });
                }
            });
        }
    </script>
</body>
</html>
